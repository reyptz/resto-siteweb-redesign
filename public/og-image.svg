<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769FCD"/>
      <stop offset="100%" stop-color="#B9D7EA"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#769FCD" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Radial glowing orbs in corners -->
  <circle cx="1050" cy="150" r="300" fill="#769FCD" opacity="0.12" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="250" fill="#008751" opacity="0.08" filter="blur(60px)"/>

  <!-- Mali National Tricolor Ribbon at top border -->
  <rect x="0" y="0" width="400" height="8" fill="#008751"/>
  <rect x="400" y="0" width="400" height="8" fill="#FCD116"/>
  <rect x="800" y="0" width="400" height="8" fill="#CE1126"/>

  <!-- Brand badge -->
  <g transform="translate(80, 70)">
    <!-- Logo container -->
    <rect width="72" height="72" rx="18" fill="#1E293B" stroke="#769FCD" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Mali Flag in Logo -->
    <rect x="18" y="20" width="11" height="32" rx="2" fill="#008751"/>
    <rect x="31" y="20" width="11" height="32" rx="2" fill="#FCD116"/>
    <rect x="44" y="20" width="11" height="32" rx="2" fill="#CE1126"/>

    <text x="92" y="38" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1">SMTD-SA</text>
    <text x="92" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#769FCD" letter-spacing="2">ENTREPRISE D'ÉTAT DU MALI</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="235" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Souveraineté Numérique &amp;
  </text>
  <text x="80" y="295" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="800" fill="url(#primary-glow)" letter-spacing="-1">
    Infrastructures Télécoms
  </text>

  <!-- Tagline / Subtitle -->
  <text x="80" y="360" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Opérateur national de référence pour la diffusion TNT, l'hébergement Data Center Tier III
  </text>
  <text x="80" y="395" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    et les liaisons fibres optiques à très haut débit en République du Mali.
  </text>

  <!-- Key Capability Badges -->
  <g transform="translate(80, 470)">
    <!-- Badge 1: Fibre -->
    <g transform="translate(0, 0)">
      <rect width="210" height="74" rx="14" fill="#0F172A" stroke="#769FCD" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Fibre Optique</text>
      <text x="24" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#769FCD">Backbone National</text>
    </g>

    <!-- Badge 2: Data Center -->
    <g transform="translate(230, 0)">
      <rect width="210" height="74" rx="14" fill="#0F172A" stroke="#769FCD" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Data Center</text>
      <text x="24" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#769FCD">Hébergement Sécurisé</text>
    </g>

    <!-- Badge 3: TNT -->
    <g transform="translate(460, 0)">
      <rect width="210" height="74" rx="14" fill="#0F172A" stroke="#769FCD" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Diffusion TNT</text>
      <text x="24" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#769FCD">Couverture Nationale</text>
    </g>

    <!-- Badge 4: Points Hauts -->
    <g transform="translate(690, 0)">
      <rect width="210" height="74" rx="14" fill="#0F172A" stroke="#769FCD" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Pylônes &amp; Points Hauts</text>
      <text x="24" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#769FCD">Colocalisation Opérateurs</text>
    </g>
  </g>

  <!-- URL link pill -->
  <g transform="translate(1000, 80)">
    <rect width="120" height="36" rx="18" fill="#769FCD" fill-opacity="0.15" stroke="#769FCD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="60" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#B9D7EA" text-anchor="middle">smtd.ml</text>
  </g>
</svg>
